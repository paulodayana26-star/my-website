<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - MyWebsite</title>
    <link rel="stylesheet" href="about.css">
    
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="nav-logo">MyWebsite</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="register.html" class="active-link">Register</a>
            <a href="contact.html">Contact Us</a>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="main-container">
        <section class="page-section form-card">
            <h2>Create an Account</h2>
            <form onsubmit="event.preventDefault(); alert('Registration Successful!');">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Dayana poul" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="dayana@example.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-success btn-full">Sign Up</button>
            </form>
        </section>
    </div>

</body>
</html>
